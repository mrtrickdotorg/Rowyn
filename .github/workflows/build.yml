name: Rowyn CI

# Payload release identity stays at build.yml@refs/heads/main.
on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - os-release
      - shared/**
      - keys/**
      - build/fetch-assets.sh
      - build/destination-derivative.Containerfile
      - build/registry-migration-destination-v1
      - build/ubuntu-hub-source.py
      - build/hub/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rowyn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/mrtrickdotorg/rowyn

jobs:
  validate:
    name: Validate source and CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install validation tools
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying" >&2
            sleep 5
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update failed after three attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: Validate Rowyn source and CI contracts
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ROWYN_MOUNT_FIXTURE_PRIVILEGED: "1"
        run: ./build/validate.sh

  hub-tests:
    name: Hub source tests
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch and port pinned upstream System Hub source
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          UPSTREAM_HUB_COMMIT: 2baf8496b5aa904c0784f4290df743ee17edae48
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kyth-os/kyth.git "${RUNNER_TEMP}/upstream-hub"
          git -C "${RUNNER_TEMP}/upstream-hub" fetch --depth 1 origin "${UPSTREAM_HUB_COMMIT}"
          git -C "${RUNNER_TEMP}/upstream-hub" checkout --detach "${UPSTREAM_HUB_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/upstream-hub" rev-parse HEAD)" = "${UPSTREAM_HUB_COMMIT}"
          python3 build/ubuntu-hub-source.py "${RUNNER_TEMP}/upstream-hub" hub-source

      # The runner image already carries Node.js; using it keeps every action in
      # this workflow SHA-pinned.
      - name: Check Node.js
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node --version

      - name: Install Hub frontend dependencies
        working-directory: hub-source/src/rowyn-hub-web
        run: npm ci

      - name: Build Hub frontend
        working-directory: hub-source/src/rowyn-hub-web
        run: npm run build

      # The Rowyn overlay suite runs against the real export, so a page that
      # stops following its sections, a broken bridge model, or an unregistered
      # command fails here instead of shipping in the image.
      - name: Run Rowyn Hub frontend tests
        working-directory: hub-source/src/rowyn-hub-web
        run: node --test tests/rowyn-*.test.mjs

  build:
    name: Build and publish image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'mrtrickdotorg/Rowyn'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main as of 2026-10-29
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Ensure podman
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          if ! command -v podman >/dev/null || ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends podman btrfs-progs
          fi
          podman --version
          mkfs.btrfs --version

      # The package layer is large enough to exhaust the runner's root disk
      # while committing (ENOSPC seen on 380df69). Keep rootful Podman
      # storage on the sparse compressed image, as the ISO build does.
      - name: Provision compressed Podman storage
        uses: ./.github/actions/setup-compressed-storage

      - name: Fetch build assets (toolchain tarball, bootc source, vendored deps)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: ./build/fetch-assets.sh

      - name: Fetch and port pinned upstream System Hub source
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          UPSTREAM_HUB_COMMIT: 2baf8496b5aa904c0784f4290df743ee17edae48
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kyth-os/kyth.git "${RUNNER_TEMP}/upstream-hub"
          git -C "${RUNNER_TEMP}/upstream-hub" fetch --depth 1 origin "${UPSTREAM_HUB_COMMIT}"
          git -C "${RUNNER_TEMP}/upstream-hub" checkout --detach "${UPSTREAM_HUB_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/upstream-hub" rev-parse HEAD)" = "${UPSTREAM_HUB_COMMIT}"
          python3 build/ubuntu-hub-source.py "${RUNNER_TEMP}/upstream-hub" hub-source

      - name: Build image (offline Containerfile)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: sudo podman build --build-arg "ROWYN_SOURCE_REVISION=${GITHUB_SHA}" -t rowyn:ci .

      - name: Inspect image and run image smoke checks
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo podman run --rm rowyn:ci cat /usr/lib/os-release
          image_revision=$(sudo podman run --rm --entrypoint /usr/bin/python3 rowyn:ci -c 'import json; print(json.load(open("/usr/share/rowyn/build-info.json"))["source_revision"])')
          test "${image_revision}" = "${GITHUB_SHA}"
          sudo podman run --rm --entrypoint /bin/sh rowyn:ci -euxc '
            grep -Fqx "NAME=\"Rowyn\"" /usr/lib/os-release
            grep -Fqx "ID=rowyn" /usr/lib/os-release
            grep -Fqx "ID_LIKE=\"ubuntu debian\"" /usr/lib/os-release
            # No baked-in login users: neither the removed spike account
            # nor the account from the Ubuntu base image may survive into
            # the payload — the login screen must offer only the account
            # the installer creates.
            ! id rowyn
            ! id ubuntu
            ! grep -Eq "^(rowyn|ubuntu):" /etc/passwd
            if guidance=$(/usr/sbin/apt-get install rowyn-test-package 2>&1); then
              echo "host apt-get unexpectedly succeeded" >&2
              exit 1
            fi
            printf "%s\n" "$guidance" | grep -Fq Distrobox
            printf "%s\n" "$guidance" | grep -Fq Discover
            ! command -v plasma-welcome
            test ! -e /usr/lib/x86_64-linux-gnu/qt6/plugins/kf6/kded/kded_plasma_welcome.so
            test -x /usr/bin/spectacle
            test -x /usr/bin/gwenview
            test -x /usr/bin/okular
            test -x /usr/bin/ark
            test -x /usr/bin/kate
            test -x /usr/bin/kcalc
            test -x /usr/bin/kdeconnect-app
            test -x /usr/bin/elisa
            test -x /usr/bin/skanpage
            test -x /usr/sbin/cupsd
            test -x /usr/bin/plasma-print-queue
            test -e /etc/systemd/system/multi-user.target.wants/cups.service
            test -e /etc/systemd/system/sockets.target.wants/cups.socket
            test -e /etc/systemd/system/multi-user.target.wants/cups-browsed.service
            test -x /usr/sbin/avahi-daemon
            test -x /usr/sbin/ipp-usb
            test -s /usr/share/rowyn/print-test-page.txt
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/plasma/kcms/systemsettings/kcm_plymouth.so
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/plasma/kcms/systemsettings/kcm_printer_manager.so
            test -s /usr/lib/x86_64-linux-gnu/qt6/plugins/kf6/kio/admin.so
            test -x /usr/bin/curl
            test -x /usr/bin/plasma-systemmonitor
            test -x /usr/bin/kamoso
            test -x /usr/bin/smbclient
            test -x /usr/sbin/smbd
            test -x /usr/bin/krdpserver
            test -s /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
            test -s /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
            vulkaninfo --summary > /dev/null
            test -x /usr/bin/htop
            test -x /usr/bin/ping
            test -x /usr/bin/lspci
            test -x /usr/bin/fwupdmgr
            test -s /usr/lib/systemd/system/fwupd.service
            locale -a | grep -qx en_US.utf8
            locale -a | grep -qi ^c.utf
            test -s /etc/locale.gen
            grep -qx LANG=en_US.UTF-8 /etc/default/locale
            test "$(readlink /etc/systemd/system/ufw.service)" = /dev/null
            test -x /usr/bin/rowyn-hub-shell
            test -x /usr/bin/kup-daemon
            test -x /usr/bin/bup
            test -x /usr/bin/rsync
            test -x /usr/bin/notify-send
            test -x /usr/bin/rowyn-update-notify
            test -x /usr/bin/rowyn-first-run
            test -s /etc/xdg/autostart/rowyn-first-run.desktop
            test -s /usr/share/applications/kcm_kup.desktop
            test -s /usr/share/applications/kcm_app-permissions.desktop
            test -s /usr/share/kio/servicemenus/rowyn-development-here.desktop
            test -e /etc/systemd/user/graphical-session.target.wants/rowyn-update-notify.timer
            if ldd /usr/bin/rowyn-hub-shell | grep -Fq "not found"; then
              echo "rowyn-hub-shell has unresolved runtime libraries" >&2
              exit 1
            fi
            test -s /usr/share/applications/com.rowyn.hub.desktop
            test -s /usr/share/icons/hicolor/512x512/apps/com.rowyn.hub.png
            test -x /usr/bin/openconnect
            test -s /etc/vpnc/vpnc-script
            test -x /usr/bin/ksshaskpass
            test -x /usr/bin/firewall-cmd
            test -x /usr/bin/rowyn-safe-upgrade
            test -x /usr/bin/rowyn-bootc-guard
            test -x /usr/bin/rowyn-report
            test -x /usr/bin/rowyn-controller-check
            rowyn-report --stdout --no-sudo > /tmp/rowyn-report.out
            grep -Fq Rowyn /tmp/rowyn-report.out
            ! grep -Eq "/home/[A-Za-z]" /tmp/rowyn-report.out
            rowyn-controller-check --json | python3 -m json.tool > /dev/null
            test -x /usr/libexec/rowyn-finalize-staged
            test -s /etc/sudoers.d/rowyn-upgrade
            test -x /usr/libexec/rowyn-update-watcher
            test -s /usr/lib/systemd/system/rowyn-update-watcher.service
            test -s /usr/lib/systemd/system/rowyn-update-watcher.timer
            test -s /usr/share/rowyn/update-policy.conf
            test -e /etc/systemd/system/timers.target.wants/rowyn-update-watcher.timer
            test -x /usr/libexec/rowyn-boot-health
            test -s /usr/lib/systemd/system/rowyn-boot-health.service
            test -s /usr/lib/systemd/system/rowyn-boot-health.timer
            test -e /etc/systemd/system/timers.target.wants/rowyn-boot-health.timer
            /usr/libexec/rowyn-boot-health status | python3 -m json.tool > /dev/null
            # USN-8996-1 (CVE-2026-109518): the fixed APT is gated in the base
            # stage of the Containerfile, and the payload is that same
            # filesystem. The rootfs normalizer deletes /var, so there is no
            # dpkg database here to read the installed version from, and the
            # apt binary reports only its upstream version; check it ships.
            test -x /usr/bin/apt-get
            test -x /usr/lib/apt/methods/http
            # Every binary the Hub probes must exist: a missing module turns a
            # settings button into a click-time error. Package presence for the
            # KCMs is asserted in the Containerfile, where the dpkg database
            # still exists; bootc-rootfs.sh deletes /var from the payload.
            test -x /usr/bin/nmcli
            test -x /usr/sbin/rfkill
            test -x /usr/bin/kscreen-doctor
            test -x /usr/bin/df
            # New accounts are seeded a permissive per-user containers
            # policy (rootless podman/distrobox pulls from any registry);
            # the strict system policy in /etc/containers stays untouched
            # for root and bootc.
            test -s /etc/skel/.config/containers/policy.json
            python3 -m json.tool /etc/skel/.config/containers/policy.json > /dev/null
            test -s /usr/share/flatpak/preinstall.d/rowyn-brave.preinstall
            grep -Fq "com.brave.Browser" /usr/share/flatpak/preinstall.d/rowyn-brave.preinstall
            test -s /usr/lib/systemd/system/rowyn-flatpak-preinstall.service
            test -e /etc/systemd/system/multi-user.target.wants/rowyn-flatpak-preinstall.service
            grep -Fq "x-scheme-handler/https=com.brave.Browser.desktop" /etc/xdg/mimeapps.list
            grep -Fq "x-scheme-handler/https=com.brave.Browser.desktop" /etc/skel/.config/mimeapps.list
            test -s /usr/share/plymouth/themes/rowyn/rowyn.plymouth
            test -s /usr/share/plymouth/themes/rowyn/rowyn.script
            test -s /usr/share/plymouth/themes/rowyn/rowyn-logo.png
            grep -Fx "Theme=rowyn" /etc/plymouth/plymouthd.conf
            test "$(readlink -f /usr/share/plymouth/themes/default.plymouth)" = /usr/share/plymouth/themes/rowyn/rowyn.plymouth
            grep -Fq "\"splash\"" /usr/lib/bootc/kargs.d/99-rowyn-splash.toml
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -Fq "usr/share/plymouth/themes/rowyn/rowyn.script"
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -Fq "usr/share/plymouth/themes/rowyn/rowyn-logo.png"
            test -s /usr/share/wallpapers/RowynBlack/contents/images/3840x2160.png
            for theme in org.kde.breeze.desktop org.kde.breezedark.desktop; do
              defaults=/usr/share/plasma/look-and-feel/$theme/contents/defaults
              test "$(kreadconfig6 --file "$defaults" --group Wallpaper --key Image)" = RowynBlack
            done
            test ! -e /etc/sudoers.d/90-rowyn-spike
            test ! -e /usr/lib/tmpfiles.d/rowyn-spike.conf
            test -s /usr/share/zoneinfo/America/Detroit
            test -s /usr/share/zoneinfo/US/Michigan
            test "$(readlink /etc/localtime)" = /usr/share/zoneinfo/Etc/UTC
            grep -Fx "Etc/UTC" /etc/timezone
            test -s /usr/lib/systemd/system/systemd-timedated.service
            test -x /usr/lib/polkit-1/polkitd
            test ! -e /usr/lib/tmpfiles.d/zz-rowyn-kde-dark.conf
            test ! -e /etc/systemd/system/multi-user.target.wants/ssh.service
            test ! -e /etc/systemd/system/sockets.target.wants/ssh.socket
            test ! -e /etc/systemd/system/sshd.service
            grep -Fqx "PasswordAuthentication no" /etc/ssh/sshd_config.d/10-rowyn.conf
            test -L /etc/systemd/system/multi-user.target.wants/rowyn-retire-spike-account.service
            test -x /usr/libexec/rowyn-retire-spike-account
            test -s /etc/NetworkManager/system-connections/rowyn-wired.nmconnection
            test -s /etc/NetworkManager/conf.d/99-rowyn-managed.conf
            test "$(readlink -f /etc/systemd/system/default.target)" = /usr/lib/systemd/system/graphical.target
            test -e /etc/systemd/system/display-manager.service
            test -e /etc/systemd/system/multi-user.target.wants/NetworkManager.service
            test -s /usr/share/wayland-sessions/plasma.desktop
            test -s /usr/share/xsessions/plasmax11.desktop
            test -x /usr/bin/kwin_wayland
            test -e /etc/systemd/system/graphical.target.wants/power-profiles-daemon.service
            test -s /usr/lib/systemd/zram-generator.conf
            grep -Fqx "zram-size = min(ram / 2, 8192)" /usr/lib/systemd/zram-generator.conf
            test -x /usr/lib/systemd/system-generators/zram-generator
            grep -Fqx "vm.swappiness = 180" /usr/lib/sysctl.d/90-rowyn-performance.conf
            grep -Fqx "vm.max_map_count = 2147483642" /usr/lib/sysctl.d/90-rowyn-performance.conf
            grep -Fqx "fs.inotify.max_user_watches = 524288" /usr/lib/sysctl.d/90-rowyn-performance.conf
            grep -Fqx "net.ipv4.tcp_congestion_control = bbr" /usr/lib/sysctl.d/90-rowyn-performance.conf
            grep -Fqx "tcp_bbr" /usr/lib/modules-load.d/rowyn-bbr.conf
            grep -Fq "lru_gen/enabled" /usr/lib/tmpfiles.d/rowyn-performance.conf
            test -x /usr/games/gamemoderun
            test -s /usr/lib/udev/rules.d/60-steam-input.rules
            grep -Fqx "ntsync" /usr/lib/modules-load.d/rowyn-ntsync.conf
            grep -Fq "KERNEL==\"ntsync\"" /usr/lib/udev/rules.d/70-rowyn-ntsync.rules
            grep -Fqx "DefaultLimitNOFILE=1024:1048576" /usr/lib/systemd/system.conf.d/90-rowyn-limits.conf
            grep -Fqx "DefaultLimitNOFILE=1024:1048576" /usr/lib/systemd/user.conf.d/90-rowyn-limits.conf
            grep -Fq "queue/scheduler" /usr/lib/udev/rules.d/60-rowyn-ioschedulers.rules
            grep -Fqx "SystemMaxUse=200M" /usr/lib/systemd/journald.conf.d/90-rowyn.conf
            grep -Fqx "renice=10" /etc/gamemode.ini
            test -x /usr/bin/rowyn-game-launch
            test -x /usr/bin/rowyn-mimalloc-run
            test -x /usr/bin/rowyn-tune
            test -f /usr/lib/systemd/user/rowyn-gaming.slice
            test -e /usr/lib/x86_64-linux-gnu/libmimalloc.so.3 || ldconfig -p | grep -Fq libmimalloc.so.3
            grep -Fqx "Indexing-Enabled=false" /etc/xdg/baloofilerc
            test ! -e /etc/systemd/system/network-online.target.wants/NetworkManager-wait-online.service
            test "$(systemctl is-enabled NetworkManager-wait-online.service || true)" != enabled
            test -x /usr/libexec/rowyn-gamemode-audio
            grep -Fqx "start=/usr/libexec/rowyn-gamemode-audio start" /etc/gamemode.ini
            grep -Fqx "end=/usr/libexec/rowyn-gamemode-audio end" /etc/gamemode.ini
            test -x /usr/libexec/rowyn-gamemode-power
            grep -Fqx "start=/usr/libexec/rowyn-gamemode-power start" /etc/gamemode.ini
            grep -Fqx "end=/usr/libexec/rowyn-gamemode-power end" /etc/gamemode.ini
            test -x /usr/bin/powerprofilesctl
            test -x /usr/lib/systemd/systemd-oomd
            test -e /etc/systemd/system/multi-user.target.wants/systemd-oomd.service
            test -e /etc/systemd/system/sockets.target.wants/systemd-oomd.socket
            grep -Fqx "SwapUsedLimit=85%" /usr/lib/systemd/oomd.conf.d/90-rowyn.conf
            grep -Fqx "DefaultMemoryPressureLimit=65%" /usr/lib/systemd/oomd.conf.d/90-rowyn.conf
            grep -Fqx "DefaultMemoryPressureDurationSec=40s" /usr/lib/systemd/oomd.conf.d/90-rowyn.conf
            grep -Fqx "ManagedOOMMemoryPressure=kill" /usr/lib/systemd/system/user.slice.d/90-rowyn-oomd.conf
            grep -Fqx "ManagedOOMMemoryPressureLimit=65%" /usr/lib/systemd/system/user@.service.d/90-rowyn-oomd.conf
            grep -Fqx "AllowHibernation=no" /usr/lib/systemd/sleep.conf.d/90-rowyn.conf
            grep -Fqx "AllowHybridSleep=no" /usr/lib/systemd/sleep.conf.d/90-rowyn.conf
            grep -Fqx "SuspendState=mem standby freeze" /usr/lib/systemd/sleep.conf.d/90-rowyn.conf
            grep -Fqx "CPUWeight=1000" /usr/lib/systemd/system/user.slice.d/90-rowyn-weights.conf
            grep -Fqx "IOWeight=1000" /usr/lib/systemd/system/user.slice.d/90-rowyn-weights.conf
            grep -Fqx "PowerProfile=power-saver" /etc/xdg/powerdevilrc
            test -x /usr/sbin/iw
            test -s /lib/firmware/regulatory.db
            test -s /usr/share/zoneinfo/zone1970.tab
            test -x /usr/libexec/rowyn-wifi-regdom
            test -s /usr/lib/systemd/system/rowyn-wifi-regdom.service
            test -e /etc/systemd/system/multi-user.target.wants/rowyn-wifi-regdom.service
            test -x /usr/bin/pw-metadata
            test "$(ls /usr/lib/modules | wc -l)" = 1
            kver=$(ls /usr/lib/modules)
            test -s "/usr/lib/modules/${kver}/kernel/nvidia-615-open/nvidia.ko"
            test -s "/usr/lib/modules/${kver}/kernel/nvidia-615-open/nvidia-drm.ko"
            test -e "/usr/lib/x86_64-linux-gnu/libGLX_nvidia.so.$(modinfo -k "${kver}" -F version nvidia)"
            test -x /usr/libexec/rowyn-gpu-select
            test -s /usr/lib/systemd/system/rowyn-gpu-select.service
            test -e /etc/systemd/system/sysinit.target.wants/rowyn-gpu-select.service
            test -s /usr/lib/rowyn/nvidia-open-devids
            test ! -e /usr/lib/modules/kernel
            test -s /usr/lib/modprobe.d/rowyn-nvidia.conf
            grep -Fqx "options nvidia-drm modeset=1 fbdev=1" /usr/lib/modprobe.d/rowyn-nvidia.conf
            test -s /usr/lib/systemd/system/nvidia-suspend.service.d/10-rowyn-nvidia-only.conf
            test -x /usr/bin/nvidia-smi
            test -s /usr/share/vulkan/icd.d/nvidia_icd.json
            test -s /usr/share/egl/egl_external_platform.d/10_nvidia_wayland.json
            test -s /usr/lib/x86_64-linux-gnu/nvidia/xorg/nvidia_drv.so
            ! test -e /usr/sbin/dkms
            ! ls -d /usr/src/nvidia-*
            if grep -rEs "^[[:space:]]*(blacklist[[:space:]]+nouveau|alias[[:space:]]+nouveau[[:space:]]+off)" /usr/lib/modprobe.d /etc/modprobe.d; then
              echo "Static nouveau blacklist found; the GPU driver is chosen at boot" >&2
              exit 1
            fi
            lsinitrd "/usr/lib/modules/${kver}/initramfs.img" > /tmp/rowyn-initrd-listing
            test -s /tmp/rowyn-initrd-listing
            if grep -E "(^|[ /])(nouveau|nvidia[A-Za-z0-9_-]*)[.]ko" /tmp/rowyn-initrd-listing; then
              echo "GPU driver module found in the initramfs" >&2
              exit 1
            fi
            test "$(readlink /etc/systemd/system/systemd-networkd.service)" = /dev/null
            podman --version
            crun --version
            test "$(readlink /etc/systemd/system/packagekit.service)" = /dev/null
            flatpak remotes --system --columns=name,url > /tmp/rowyn-flatpak-remotes
            grep -F "https://dl.flathub.org/repo/" /tmp/rowyn-flatpak-remotes
            backends=$(QT_QPA_PLATFORM=offscreen LC_ALL=C.UTF-8 plasma-discover --listbackends)
            echo "$backends" | grep -F " * flatpak-backend"
            if echo "$backends" | grep -E " \* (packagekit|snap)-backend"; then
              echo "Native package backend exposed on immutable OS" >&2
              exit 1
            fi
            distrobox-create --help > /tmp/rowyn-distrobox-help
            grep -F "default: docker.io/library/ubuntu:26.10" /tmp/rowyn-distrobox-help
            test "$(netplan get network.renderer)" = NetworkManager
            netplan generate --root-dir /
            test -s /etc/NetworkManager/system-connections/rowyn-wired.nmconnection
            test ! -e /run/NetworkManager/system-connections/netplan-all-en.nmconnection
            test ! -e /run/NetworkManager/system-connections/netplan-all-eth.nmconnection
            if test -f /run/udev/rules.d/90-netplan.rules; then
              ! grep -F "NM_UNMANAGED}=\"1\"" /run/udev/rules.d/90-netplan.rules
            fi
          '
          {
            echo '### Image'
            sudo podman image inspect rowyn:ci --format '- size: {{.Size}} bytes'
            sudo podman image inspect rowyn:ci --format '- local digest: {{.Digest}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push immutable image and spike alias to GHCR
        id: publish
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          test -n "${GHCR_TOKEN}"
          image_ref="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          digest_file="${RUNNER_TEMP}/rowyn-image.digest"

          printf '%s' "${GHCR_TOKEN}" | sudo podman login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          sudo podman tag rowyn:ci "${image_ref}"
          sudo podman tag rowyn:ci "${IMAGE_REPOSITORY}:spike"

          sudo podman push --digestfile "${digest_file}" "${image_ref}"
          image_digest="$(cat "${digest_file}")"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Keep the human-friendly spike tag, but never use it as the input to
          # a downstream job. The ISO consumes image_ref@image_digest below.
          sudo podman push "${IMAGE_REPOSITORY}:spike"

          {
            echo "image_ref=${image_ref}"
            echo "image_digest=${image_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '### Published image'
            echo "- ref: \`${image_ref}\`"
            echo "- digest: \`${image_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write immutable image metadata
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          mkdir -p output
          jq -n \
            --arg image "${IMAGE_REF}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{image: $image, digest: $digest, source_sha: $source_sha, run_id: $run_id}' \
            > output/image-build-metadata.json

      - name: Upload immutable image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rowyn-image-metadata-${{ github.sha }}
          path: output/image-build-metadata.json
          retention-days: 7
          if-no-files-found: error

  # Sign the exact published image before the custom installer environment
  # consumes it. The installer embeds the signature bundle and the digest;
  # unsigned registry sources are rejected by the live daemon.
  sign:
    name: Sign published image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'mrtrickdotorg/Rowyn'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Sign exact image digest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          test -n "${IMAGE_REF}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "${GHCR_TOKEN}"
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/mrtrickdotorg/rowyn" ]]
          printf '%s' "${GHCR_TOKEN}" | cosign login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          cosign sign -y "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          IMAGE_NAME="${IMAGE_REF%:*}"
          [[ "${IMAGE_NAME}" == "ghcr.io/mrtrickdotorg/rowyn" ]]
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  # Build the promoted image as a derivative with a new rootfs marker. bootc
  # 1.17.3 refuses `switch` when the target composefs digest is already
  # deployed, so the promoted image must differ from prior images. This job
  # must succeed before stable advances.
  promote:
    name: Promote verified image to stable
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'mrtrickdotorg/Rowyn'
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      destination_digest: ${{ steps.build_destination.outputs.destination_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.1

      - name: Install Podman and Skopeo
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends podman skopeo btrfs-progs
          command -v podman
          command -v skopeo
          podman --version
          skopeo --version

      - name: Setup compressed Podman storage
        uses: ./.github/actions/setup-compressed-storage

      - name: Build and publish unique destination image
        id: build_destination
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          test -n "${IMAGE_REF}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "${GHCR_TOKEN}"
          SOURCE_IMAGE="${IMAGE_REF%:*}"
          [[ "${SOURCE_IMAGE}" == "ghcr.io/mrtrickdotorg/rowyn" ]]
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          push_digest_file="${RUNNER_TEMP}/rowyn-destination.digest"
          marker="/usr/share/rowyn-registry-migration-destination-v1"
          source_digest="$(skopeo inspect --no-creds --format '{{.Digest}}' \
            "docker://${SOURCE_IMAGE}@${IMAGE_DIGEST}")"
          [[ "${source_digest}" == "${IMAGE_DIGEST}" ]]
          echo "${GHCR_TOKEN}" | sudo podman login ghcr.io \
            -u "${GHCR_USERNAME}" --password-stdin
          sudo podman build --pull=always --format oci \
            --build-arg "ROWYN_BASE_IMAGE=${SOURCE_IMAGE}@${IMAGE_DIGEST}" \
            -f build/destination-derivative.Containerfile \
            -t "${DEST_IMAGE}:${GITHUB_SHA}-destination" .
          # Prove that the destination-only file is absent from the verified
          # bridge base and present in the image whose fs-verity root changes.
          sudo podman run --rm --entrypoint /bin/sh \
            "${SOURCE_IMAGE}@${IMAGE_DIGEST}" -ec 'test ! -e "$1"' sh "${marker}"
          sudo podman run --rm --entrypoint /bin/sh \
            "${DEST_IMAGE}:${GITHUB_SHA}-destination" -ec 'test -s "$1"' sh "${marker}"
          sudo podman run --rm --entrypoint /usr/bin/bootc \
            "${DEST_IMAGE}:${GITHUB_SHA}-destination" container lint
          sudo podman push --digestfile "${push_digest_file}" \
            "${DEST_IMAGE}:${GITHUB_SHA}-destination"
          destination_digest="$(cat "${push_digest_file}")"
          [[ "${destination_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${destination_digest}" != "${IMAGE_DIGEST}" ]]
          echo "destination_digest=${destination_digest}" >> "${GITHUB_OUTPUT}"
          published_digest="$(skopeo inspect --no-creds --format '{{.Digest}}' \
            "docker://${DEST_IMAGE}:${GITHUB_SHA}-destination")"
          [[ "${published_digest}" == "${destination_digest}" ]]

      - name: Sign exact destination image with update-channel key
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_DIGEST: ${{ steps.build_destination.outputs.destination_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROWYN_UPDATE_SIGNING_KEY: ${{ secrets.ROWYN_UPDATE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.ROWYN_UPDATE_SIGNING_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          [[ "${DESTINATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -s "keys/update.pub"
          test -n "${GHCR_TOKEN}"
          test -n "${ROWYN_UPDATE_SIGNING_KEY}"
          test -n "${COSIGN_PASSWORD}"
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          printf '%s' "${GHCR_TOKEN}" | cosign login ghcr.io \
            -u "${GHCR_USERNAME}" --password-stdin
          cosign sign --yes --key env://ROWYN_UPDATE_SIGNING_KEY \
            "${DEST_IMAGE}@${DESTINATION_DIGEST}"

      - name: Sign exact destination image with keyless identity
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_DIGEST: ${{ steps.build_destination.outputs.destination_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          [[ "${DESTINATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          printf '%s' "${GHCR_TOKEN}" | cosign login ghcr.io \
            -u "${GHCR_USERNAME}" --password-stdin
          cosign sign -y "${DEST_IMAGE}@${DESTINATION_DIGEST}"

      - name: Verify destination update-channel signature
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_DIGEST: ${{ steps.build_destination.outputs.destination_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          [[ "${DESTINATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -s "keys/update.pub"
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          printf '%s' "${GHCR_TOKEN}" | cosign login ghcr.io \
            -u "${GHCR_USERNAME}" --password-stdin
          cosign verify --key keys/update.pub \
            "${DEST_IMAGE}@${DESTINATION_DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${DEST_IMAGE}@${DESTINATION_DIGEST}"

      - name: Reject stale main before destination stable promotion
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "${GH_TOKEN}"
          test -n "${GITHUB_REPOSITORY}"
          expected_sha="${EXPECTED_SHA:-}"
          [[ "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]
          main_head_sha="$(
            gh api \
              --method GET \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq 'if (.ref == "refs/heads/main" and .object.type == "commit" and (.object.sha | type == "string") and (.object.sha | test("^[0-9a-f]{40}$"))) then .object.sha else error("unexpected main ref response") end'
          )"
          [[ "${main_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${main_head_sha}" != "${expected_sha}" ]]; then
            echo "main advanced from ${expected_sha} to ${main_head_sha}; refusing destination stable promotion" >&2
            exit 1
          fi

      - name: Promote exact digest to destination stable
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_DIGEST: ${{ steps.build_destination.outputs.destination_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          [[ "${DESTINATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "${GHCR_TOKEN}"
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          auth_file="${RUNNER_TEMP}/rowyn-destination-auth.json"
          umask 077
          trap 'rm -f "${auth_file}"' EXIT
          printf '%s' "${GHCR_TOKEN}" | skopeo login \
            --authfile "${auth_file}" \
            --username "${GHCR_USERNAME}" \
            --password-stdin ghcr.io
          skopeo copy --preserve-digests \
            --src-authfile "${auth_file}" --dest-authfile "${auth_file}" \
            "docker://${DEST_IMAGE}@${DESTINATION_DIGEST}" \
            "docker://${DEST_IMAGE}:stable"
          stable_digest="$(skopeo inspect --authfile "${auth_file}" \
            --format '{{.Digest}}' "docker://${DEST_IMAGE}:stable")"
          [[ "${stable_digest}" == "${DESTINATION_DIGEST}" ]]

      - name: Verify destination stable tag digest
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          DESTINATION_DIGEST: ${{ steps.build_destination.outputs.destination_digest }}
        run: |
          [[ "${DESTINATION_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          DEST_IMAGE="ghcr.io/mrtrickdotorg/rowyn"
          stable_digest="$(skopeo inspect --no-creds \
            --format '{{.Digest}}' "docker://${DEST_IMAGE}:stable")"
          [[ "${stable_digest}" == "${DESTINATION_DIGEST}" ]]

