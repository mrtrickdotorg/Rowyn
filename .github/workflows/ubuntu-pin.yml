name: Rowyn Ubuntu digest pin

# The payload and the live ISO start from one digest-pinned Ubuntu image
# (build/ubuntu-only-check.py enforces that they agree). Canonical replaces
# that image behind the tag, so resolve it on a schedule, move every pin
# together, validate, and commit to main. A commit pushed with the workflow
# token starts no runs of its own, so a landed bump then dispatches Rowyn
# CI explicitly to build, smoke-test and sign the new pin. On days the pin
# does not move, the run instead dispatches one rebuild, so archive
# package and security updates land daily; reproducible builds make a
# no-change rebuild produce the identical digest, so clients download
# nothing on a quiet day, and Rowyn CI compares that rebuild with the
# digest it recorded for the same source revision and package set, so a
# drift fails the build instead of reaching them. The repository takes no pull requests, so this
# never opens one.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # A landed bump dispatches Rowyn CI through the Actions API with this
  # same token; without actions: write that dispatch is refused.
  actions: write

concurrency:
  group: rowyn-ubuntu-pin
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.repository == 'mrtrickdotorg/Rowyn' &&
      github.ref == 'refs/heads/main'
    name: Move the Ubuntu digest pin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Install validation tools
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_TARBALL: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_TARBALL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_TARBALL: shellcheck-v0.11.0.linux.x86_64.tar.gz
          SHELLCHECK_TARBALL_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying" >&2
            sleep 5
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update failed after three attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends python3-yaml skopeo
          # actionlint lints each workflow's inline run scripts with the
          # ShellCheck on PATH, so that one is pinned too (same values as
          # build.yml) and wins over the runner image's copy at
          # /usr/local/bin.
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${SHELLCHECK_TARBALL}" \
            -o "${RUNNER_TEMP}/${SHELLCHECK_TARBALL}"
          echo "${SHELLCHECK_TARBALL_SHA256}  ${RUNNER_TEMP}/${SHELLCHECK_TARBALL}" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/${SHELLCHECK_TARBALL}"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version
          reported_shellcheck="$(shellcheck --version | sed -n 's/^version: //p')"
          if [[ "${reported_shellcheck}" != "${SHELLCHECK_VERSION#v}" ]]; then
            echo "::error::shellcheck ${reported_shellcheck:-missing} is not the pinned ${SHELLCHECK_VERSION}" >&2
            exit 1
          fi
          # ./build/validate.sh requires the pinned actionlint, so the pin
          # lives in every workflow that validates (same values as build.yml).
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${ACTIONLINT_TARBALL}" \
            -o "${RUNNER_TEMP}/${ACTIONLINT_TARBALL}"
          echo "${ACTIONLINT_TARBALL_SHA256}  ${RUNNER_TEMP}/${ACTIONLINT_TARBALL}" | sha256sum -c -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/${ACTIONLINT_TARBALL}" actionlint
          sudo install -m 0755 "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Resolve the published Ubuntu image
        id: resolve
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          pinned="$(python3 build/ubuntu-pin-bump.py --pinned)"
          newest="$(python3 build/ubuntu-pin-bump.py --resolve)"
          echo "pinned=${pinned}" >> "${GITHUB_OUTPUT}"
          echo "newest=${newest}" >> "${GITHUB_OUTPUT}"
          if [ "${pinned}" = "${newest}" ]; then
            echo "::notice::Ubuntu pin is current: ${pinned}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Ubuntu pin moves ${pinned} to ${newest}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Move both pins and validate
        if: steps.resolve.outputs.changed == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          ROWYN_MOUNT_FIXTURE_PRIVILEGED: "1"
        run: |
          python3 build/ubuntu-pin-bump.py --apply "${{ steps.resolve.outputs.newest }}"
          ./build/validate.sh

      - name: Commit the pin to main
        id: commit
        if: steps.resolve.outputs.changed == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          NEWEST: ${{ steps.resolve.outputs.newest }}
          PINNED: ${{ steps.resolve.outputs.pinned }}
        run: |
          if git diff --quiet; then
            echo "::notice::pin already matched; nothing to commit"
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "rowyn-ci"
          git config user.email "rowyn-ci@users.noreply.github.com"
          git add Containerfile \
            build/hub/src-tauri/src/commands/rowyn_development.rs \
            build/hub/src-tauri/src/commands/rowyn_deb.rs \
            build/hub/src/services/rowynDevelopmentModel.ts \
            docs/building.md
          git commit -m "$(printf 'chore(image): pin Ubuntu to %s\n\nScheduled digest bump: %s -> %s.\n' \
            "${NEWEST#*@}" "${PINNED#*@}" "${NEWEST#*@}")"
          git push origin main
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Rowyn CI for the landed bump
        if: steps.commit.outputs.committed == 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bump commit above was pushed with the workflow token, and
          # token pushes start no other workflow runs — without this step
          # the new pin would sit unbuilt until an unrelated push happened
          # to run Rowyn CI on main. Starting a run by dispatch is the one
          # route the built-in token is allowed, so dispatch Rowyn CI on
          # main now and let it build, sign and promote the new pin. If the
          # dispatch itself is refused this step fails the run: a bump that
          # lands but never builds has to be loud, not silent.
          gh workflow run build.yml --repo "${{ github.repository }}" --ref main

      - name: Dispatch the daily rebuild
        if: steps.commit.outputs.committed != 'true'
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No bump was committed on this run — the pin is already
          # current, or the bump turned out to be already applied — so
          # the step above dispatched nothing. Dispatch one build
          # anyway: the image installs its packages from the Ubuntu
          # archive at build time, and that archive moves daily even
          # when the base digest does not. Builds are reproducible, so
          # if the archive has not changed either, the rebuild produces
          # the identical digest and clients see no update at all; if
          # it has, only the changed layers differ and clients download
          # just those. Exactly one dispatch leaves this workflow per
          # run: this step and the bump dispatch key off opposite
          # values of the same committed signal (a skipped commit step
          # leaves the signal unset, which is not 'true'). If this
          # dispatch is refused the step fails the run, for the same
          # reason as above: a silently skipped day is the failure mode
          # this cadence exists to remove.
          gh workflow run build.yml --repo "${{ github.repository }}" --ref main
